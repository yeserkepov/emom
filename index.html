<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMOM таймер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMOM">
<meta name="theme-color" content="#0B1A21">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1A21;
    --acid:#8CFF1A;
    --prep:#2A4A63;
    --rest:#4FB3FF;
    --alert:#F5C13D;
    --light:#F0F4F3;
    --dark:#06140A;
    --display:"Oswald","Arial Narrow",Arial,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --bg:#0B1A21; --light:#F0F4F3; }
  }
  :root[data-theme="dark"]{ --bg:#0B1A21; --light:#F0F4F3; }
  html{height:100%;}
  *,*::before,*::after{box-sizing:inherit;}
  body{margin:0;height:100%;background:var(--bg);color:var(--light);
       font-family:var(--display);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  button{font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;
         -webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  :focus-visible{outline:3px solid var(--alert);outline-offset:2px;}

  .app{position:relative;height:100%;overflow:hidden;}

  /* два одинаковых слоя: светлый текст на тёмном фоне и тёмный — внутри заливки */
  .layer{
    --ink:var(--light); --muted:#7E969E; --line:rgba(240,244,243,.3);
    --pip:rgba(240,244,243,.22); --btn-bg:var(--light); --btn-fg:var(--bg);
    position:absolute;left:0;right:0;bottom:0;height:var(--app-h,100%);
    display:flex;flex-direction:column;color:var(--ink);
  }
  .layer.ghost{
    --ink:var(--dark); --muted:rgba(6,20,10,.62); --line:rgba(6,20,10,.45);
    --pip:rgba(6,20,10,.25); --btn-bg:var(--dark); --btn-fg:var(--acid);
    pointer-events:none;
  }
  .app.rest .layer.ghost{ --btn-fg:var(--rest); }
  .app.prep .layer.ghost{
    --ink:var(--light); --muted:#A9BDC6; --line:rgba(240,244,243,.4);
    --pip:rgba(240,244,243,.25); --btn-bg:var(--light); --btn-fg:var(--prep);
  }
  .app.alert .layer.ghost{
    --ink:#1A1405; --muted:rgba(26,20,5,.6); --line:rgba(26,20,5,.45);
    --pip:rgba(26,20,5,.28); --btn-bg:#1A1405; --btn-fg:var(--alert);
  }

  #fill{position:absolute;left:0;right:0;bottom:0;height:0;overflow:hidden;z-index:2;
        pointer-events:none;background:var(--acid);
        transition:height .12s linear,background-color .15s;}
  .app.prep #fill{background:var(--prep);}
  .app.rest #fill{background:var(--rest);}
  .app.alert #fill{background:var(--alert);height:100% !important;}
  @media (prefers-reduced-motion:reduce){#fill{transition:none;}}

  .top{display:flex;justify-content:space-between;align-items:baseline;padding:1.1rem 1.2rem 0;
       font-size:1.35rem;font-weight:500;letter-spacing:.02em;}
  .top em{font-style:normal;color:var(--muted);}
  .total{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;}

  /* экран тренировки */
  .core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;}
  .app.idle .core{display:none;}
  .clock{margin:0;font-weight:500;font-variant-numeric:tabular-nums;
         font-size:clamp(7rem,46vw,16rem);line-height:.82;letter-spacing:-.02em;}
  .app.done .clock{font-size:clamp(4.5rem,26vw,10rem);}
  .cap{margin:0;min-height:1.5em;font-size:1.25rem;color:var(--muted);letter-spacing:.04em;text-align:center;}

  /* экран настройки */
  .setup{display:none;flex:1;min-height:0;overflow-y:auto;flex-direction:column;gap:.55rem;
         padding:.9rem 1.2rem .9rem;}
  .app.idle .setup{display:flex;}
  .count{display:flex;justify-content:space-between;align-items:center;
         padding-bottom:.9rem;border-bottom:1px solid var(--line);margin-bottom:.35rem;}
  .count .lbl{font-size:1.45rem;color:var(--ink);}
  .count .step button{width:3.3rem;height:3.3rem;font-size:1.8rem;}
  .count .step b{min-width:3rem;font-size:2rem;}
  .head,.srow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 8.6rem;align-items:center;gap:.6rem;}
  .head{font-size:.8rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
  .head span:last-child{text-align:center;}
  .lbl{font-size:1.3rem;font-weight:500;color:var(--muted);}
  .srow.all{padding-bottom:.6rem;border-bottom:1px dashed var(--line);margin-bottom:.15rem;}
  .srow.all .lbl{font-size:.95rem;letter-spacing:.04em;}
  .srow.all[hidden]{display:none;}
  #rows{display:flex;flex-direction:column;gap:.55rem;}
  .sound{display:flex;justify-content:space-between;align-items:center;gap:1rem;
         margin-top:.45rem;padding-top:.9rem;border-top:1px solid var(--line);}
  .sound .lbl{color:var(--ink);font-size:1.2rem;}
  .sound .seg{flex:0 1 15rem;}
  .sound .seg button{font-size:1rem;letter-spacing:.03em;}

  .seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .seg button{flex:1;min-width:0;height:2.9rem;border:0;background:transparent;color:var(--ink);
              font-size:1.2rem;font-variant-numeric:tabular-nums;}
  .seg button+button{border-left:1px solid var(--line);}
  .seg button[aria-pressed="true"]{background:var(--acid);color:var(--dark);font-weight:600;}

  .step{display:flex;align-items:center;justify-content:space-between;gap:.2rem;}
  .step button{width:2.8rem;height:2.8rem;border-radius:50%;border:1px solid var(--line);
               background:transparent;color:var(--ink);font-size:1.5rem;font-weight:400;line-height:1;padding:0;}
  .step button:disabled{opacity:.25;cursor:default;}
  .step b{min-width:2.6rem;text-align:center;font-weight:500;font-size:1.3rem;font-variant-numeric:tabular-nums;}
  .fin{text-align:center;color:var(--muted);font-size:1rem;letter-spacing:.06em;}
  .srow.last .step{display:none;}
  .srow:not(.last) .fin{display:none;}

  /* полоса раундов: длина сегмента = длительность */
  .pips{display:flex;align-items:flex-end;gap:4px;padding:0 1.2rem .8rem;}
  .pips i{height:6px;border-radius:1px;background:var(--pip);min-width:4px;}
  .pips i.r{height:3px;}
  .pips i.on{background:var(--ink);}
  .pips i.cur{background:var(--muted);}

  .ctrl{display:flex;gap:.7rem;padding:0 1.2rem 1.3rem;}
  .ctrl button{min-height:4rem;border-radius:2px;font-size:1.3rem;font-weight:500;letter-spacing:.04em;}
  .btn-main{flex:1;border:1px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);}
  .btn-reset{flex:0 0 30%;background:transparent;color:var(--ink);border:1px solid var(--line);}
  .app.idle .btn-reset{display:none;}
  .app.running .btn-main{background:transparent;color:var(--ink);border-color:var(--line);}
</style>
</head>
<body>
<div class="app idle" id="app">
  <div class="layer" id="base">
    <div class="top">
      <span class="round" id="round">EMOM</span>
      <span class="total" id="total"></span>
    </div>

    <div class="setup" id="setup">
      <div class="count">
        <span class="lbl">Раунды</span>
        <div class="step">
          <button data-act="n-" aria-label="Меньше раундов">−</button>
          <b id="nVal">3</b>
          <button data-act="n+" aria-label="Больше раундов">+</button>
        </div>
      </div>
      <div class="head"><span></span><span>Работа, сек</span><span>Отдых, сек</span></div>
      <div class="srow all" data-i="all" id="allRow">
        <span class="lbl">Все</span>
        <div class="seg">
          <button data-act="w" data-v="30" aria-pressed="false">30</button>
          <button data-act="w" data-v="60" aria-pressed="false">60</button>
          <button data-act="w" data-v="90" aria-pressed="false">90</button>
        </div>
        <div class="step">
          <button data-act="p-" aria-label="Меньше отдыха для всех">−</button>
          <b>0</b>
          <button data-act="p+" aria-label="Больше отдыха для всех">+</button>
        </div>
      </div>
      <div id="rows"></div>
      <div class="sound">
        <span class="lbl">Звук</span>
        <div class="seg">
          <button data-act="snd" data-v="voice" aria-pressed="false">Голос</button>
          <button data-act="snd" data-v="beep" aria-pressed="false">Сигнал</button>
          <button data-act="snd" data-v="off" aria-pressed="false">Выкл</button>
        </div>
      </div>
    </div>

    <div class="core">
      <p class="clock" id="clock"></p>
      <p class="cap" id="cap"></p>
    </div>
    <div class="pips" id="pips"></div>
    <div class="ctrl">
      <button class="btn-reset" id="reset">Сброс</button>
      <button class="btn-main" id="main">Старт</button>
    </div>
  </div>
  <div id="fill"><div class="layer ghost" id="ghost" aria-hidden="true"></div></div>
</div>

<script>
(function(){
  "use strict";
  var MAXN=5, PREP=5, WORKS=[30,60,90], PSTEP=5, PMAX=60, KEY="emom-cfg2";
  var cfg={n:3, r:[], sound:"voice"};
  for(var k=0;k<MAXN;k++) cfg.r.push({w:60,p:10});
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s && s.n>=1 && s.n<=MAXN && s.r && s.r.length===MAXN){
      var ok=s.r.every(function(x){ return WORKS.indexOf(x.w)>=0 && x.p>=0 && x.p<=PMAX && x.p%PSTEP===0; });
      if(ok) cfg=s;
    }
  }catch(e){}
  if(["voice","beep","off"].indexOf(cfg.sound)<0) cfg.sound="voice";

  var $=function(i){return document.getElementById(i);};
  var app=$("app"), base=$("base"), ghost=$("ghost"), fill=$("fill"), setup=$("setup"),
      rowsEl=$("rows"), allRow=$("allRow"), nVal=$("nVal"),
      clock=$("clock"), cap=$("cap"), roundEl=$("round"), totalEl=$("total"), pips=$("pips"),
      mainBtn=$("main"), resetBtn=$("reset");

  var state="idle", t0=0, pausedAt=0, lost=0, raf=0, last="", cur=-1, wake=null, ac=null,
      PH=[], TOTAL=0;

  /* тёмная копия интерфейса внутри заливки */
  function sync(){ ghost.innerHTML=base.innerHTML.replace(/\sid="[^"]*"/g,""); }
  function fit(){ app.style.setProperty("--app-h", app.clientHeight+"px"); }
  window.addEventListener("resize",fit);
  window.addEventListener("orientationchange",function(){ setTimeout(fit,200); });

  function plural(n,one,few,many){ var a=n%10,b=n%100;
    if(a===1&&b!==11) return one;
    if(a>=2&&a<=4&&(b<12||b>14)) return few;
    return many; }
  function mmss(s){ s=Math.max(0,Math.ceil(s)); var m=Math.floor(s/60), r=s%60;
    return m+":"+(r<10?"0":"")+r; }
  function clampP(v){ return Math.min(PMAX,Math.max(0,v)); }

  /* фазы: подготовка → раунд → отдых → раунд … (после последнего раунда отдыха нет) */
  function phases(){
    var list=[{t:"prep",d:PREP,i:0}], i;
    for(i=0;i<cfg.n;i++){
      list.push({t:"work",d:cfg.r[i].w,i:i});
      if(i<cfg.n-1 && cfg.r[i].p>0) list.push({t:"rest",d:cfg.r[i].p,i:i});
    }
    var at=0; list.forEach(function(p){ p.start=at; at+=p.d; p.end=at; });
    return list;
  }
  function buildPips(list){
    pips.innerHTML="";
    list.slice(1).forEach(function(p){
      var el=document.createElement("i");
      if(p.t==="rest") el.className="r";
      el.style.flex=p.d+" 1 0";
      pips.appendChild(el);
    });
  }

  /* ---------- настройка ---------- */
  function rowHTML(i){
    return '<div class="srow" data-i="'+i+'"><span class="lbl">'+(i+1)+'</span>'+
      '<div class="seg">'+WORKS.map(function(v){
        return '<button data-act="w" data-v="'+v+'" aria-pressed="false" aria-label="Раунд '+(i+1)+': '+v+' секунд">'+v+'</button>';
      }).join("")+'</div>'+
      '<div class="rcell"><div class="step">'+
        '<button data-act="p-" aria-label="Меньше отдыха после раунда '+(i+1)+'">−</button><b>0</b>'+
        '<button data-act="p+" aria-label="Больше отдыха после раунда '+(i+1)+'">+</button>'+
      '</div><div class="fin">финиш</div></div></div>';
  }
  function paintRow(row,w,p,pMixed){
    row.querySelectorAll(".seg button").forEach(function(b){
      b.setAttribute("aria-pressed", String(+b.dataset.v===w));
    });
    var st=row.querySelector(".step"), btns=st.querySelectorAll("button");
    st.querySelector("b").textContent=pMixed?"—":p;
    btns[0].disabled=!pMixed && p<=0;
    btns[1].disabled=!pMixed && p>=PMAX;
  }
  function render(){
    var n=cfg.n, i;
    nVal.textContent=n;
    var nb=setup.querySelectorAll(".count button");
    nb[0].disabled=n<=1; nb[1].disabled=n>=MAXN;

    if(rowsEl.children.length!==n){
      var h=""; for(i=0;i<n;i++) h+=rowHTML(i); rowsEl.innerHTML=h;
    }
    for(i=0;i<n;i++){
      var row=rowsEl.children[i];
      row.classList.toggle("last",i===n-1);
      paintRow(row,cfg.r[i].w,cfg.r[i].p,false);
    }

    allRow.hidden=n<2;
    var w0=cfg.r[0].w, p0=cfg.r[0].p, wSame=true, pSame=true;
    for(i=1;i<n;i++) if(cfg.r[i].w!==w0) wSame=false;
    for(i=1;i<n-1;i++) if(cfg.r[i].p!==p0) pSame=false;
    paintRow(allRow, wSame?w0:-1, p0, !pSame);

    var list=phases(), sum=list[list.length-1].end-PREP;
    totalEl.textContent="всего "+mmss(sum);
    roundEl.textContent="EMOM";
    buildPips(list);
    setup.querySelectorAll(".sound button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.v===cfg.sound));
    });
    try{ localStorage.setItem(KEY,JSON.stringify(cfg)); }catch(e){}
  }

  function act(btn){
    if(!btn || btn.disabled || state!=="idle") return;
    var a=btn.dataset.act, row=btn.closest(".srow"), idx=row?row.dataset.i:null, n=cfg.n, i;
    if(a==="snd"){
      cfg.sound=btn.dataset.v; render(); audioMode();
      if(cfg.sound==="voice") say("Раунд один");
      else if(cfg.sound==="beep"){ audioOn(); beep(1046,.22,.22); }
      return;
    }
    if(a==="n-"){ cfg.n=Math.max(1,n-1); }
    else if(a==="n+"){
      if(n<MAXN){ cfg.r[n]={w:cfg.r[n-1].w,p:cfg.r[n-1].p}; cfg.n=n+1; }
    }
    else if(a==="w"){
      var v=+btn.dataset.v;
      if(idx==="all"){ for(i=0;i<n;i++) cfg.r[i].w=v; } else cfg.r[+idx].w=v;
    }
    else if(a==="p-"||a==="p+"){
      var d=a==="p+"?PSTEP:-PSTEP;
      if(idx==="all"){ var nv=clampP(cfg.r[0].p+d); for(i=0;i<n-1;i++) cfg.r[i].p=nv; }
      else cfg.r[+idx].p=clampP(cfg.r[+idx].p+d);
    }
    render();
  }

  /* удержание кнопок −/+ листает значения */
  var holdT=0, holdI=0;
  function stopHold(){ clearTimeout(holdT); clearInterval(holdI); holdT=holdI=0; }
  setup.addEventListener("pointerdown",function(e){
    var btn=e.target.closest("button[data-act]");
    if(!btn || ["n-","n+","p-","p+"].indexOf(btn.dataset.act)<0) return;
    e.preventDefault();
    act(btn); stopHold();
    holdT=setTimeout(function(){
      holdI=setInterval(function(){ if(btn.disabled||!btn.isConnected) stopHold(); else act(btn); },110);
    },420);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    document.addEventListener(ev,stopHold);
  });
  setup.addEventListener("click",function(e){
    var btn=e.target.closest("button[data-act]");
    if(!btn) return;
    var a=btn.dataset.act;
    if(a==="w" || a==="snd" || e.detail===0) act(btn);   /* сегменты и клавиатура */
  });

  /* ---------- звук, вибрация, экран ---------- */
  function audioOn(){
    try{ var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      if(!ac) ac=new C(); if(ac.state==="suspended") ac.resume(); }catch(e){}
  }
  function beep(f,d,v){
    try{ if(!ac) return; var o=ac.createOscillator(), g=ac.createGain();
      o.type="square"; o.frequency.value=f;
      g.gain.setValueAtTime(v||.16,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d+.02);
    }catch(e){}
  }
  function tone(f,d,v){ if(cfg.sound==="beep") beep(f,d,v); }

  /* голос: встроенный русский синтезатор iOS, работает офлайн */
  var NUM=["один","два","три","четыре","пять"],
      DUR={30:"тридцать секунд",60:"минута",90:"полторы минуты"},
      synth=window.speechSynthesis||null, voice=null;
  function pickVoice(){
    try{ var ru=(synth.getVoices()||[]).filter(function(v){ return /^ru/i.test(v.lang); });
      voice=ru.filter(function(v){ return /milena|милена/i.test(v.name); })[0]||ru[0]||null; }catch(e){}
  }
  if(synth){ pickVoice(); try{ synth.addEventListener("voiceschanged",pickVoice); }catch(e){} }
  function say(t){
    if(cfg.sound!=="voice" || !synth) return;
    try{
      if(synth.speaking||synth.pending) synth.cancel();
      var u=new SpeechSynthesisUtterance(t);
      u.lang="ru-RU"; if(voice) u.voice=voice; u.rate=1.1; u.volume=1;
      synth.speak(u);
    }catch(e){}
  }
  function hush(){ try{ if(synth) synth.cancel(); }catch(e){} }
  /* звук идёт и в беззвучном режиме iPhone (Safari 16.4+) */
  function audioMode(){ try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){} }

  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function awake(){
    try{ if(navigator.wakeLock && !wake) navigator.wakeLock.request("screen")
      .then(function(w){ wake=w; w.addEventListener("release",function(){wake=null;}); })
      .catch(function(){}); }catch(e){}
  }
  function sleep(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible" && state==="running") awake();
  });

  /* ---------- тренировка ---------- */
  function onPhase(p){
    if(p.t==="work"){
      tone(1046,.22,.22); buzz([120,60,120]);
      say(cfg.n>1 && p.i===cfg.n-1 ? "Последний раунд" : "Раунд "+NUM[p.i]);
    }else if(p.t==="rest"){
      tone(523,.3,.2); buzz(250);
      say(p.d>=10 ? "Отдых. Дальше "+DUR[cfg.r[p.i+1].w] : "Отдых");
    }
  }
  function caption(p){
    var n=cfg.n;
    if(p.t==="prep") return "раунд 1 · "+cfg.r[0].w+" сек";
    if(p.t==="rest") return "дальше раунд "+(p.i+2)+" · "+cfg.r[p.i+1].w+" сек";
    if(p.i===n-1) return n>1?"последний раунд":"";
    return cfg.r[p.i].p>0 ? "затем отдых "+cfg.r[p.i].p+" сек" : "затем раунд "+(p.i+2);
  }

  function tick(now){
    var el=(now-t0-lost)/1000;
    if(el>=TOTAL){ finish(); return; }
    var k=0; while(k<PH.length-1 && el>=PH[k].end) k++;
    var p=PH[k], left=p.end-el;
    fill.style.height=(left/p.d*100).toFixed(2)+"%";

    var w=Math.ceil(left), key=k+":"+w;
    if(key!==last){
      last=key;
      var fresh=k!==cur;
      if(fresh){ if(cur>=0) onPhase(p); cur=k; }
      app.classList.toggle("prep",p.t==="prep");
      app.classList.toggle("rest",p.t==="rest");
      app.classList.toggle("alert",w<=3);
      clock.textContent=w;
      if(fresh){
        cap.textContent=caption(p);
        if(p.t==="prep") roundEl.textContent="Приготовься";
        else if(p.t==="rest") roundEl.textContent="Отдых";
        else roundEl.innerHTML="Раунд "+(p.i+1)+" <em>/ "+cfg.n+"</em>";
        for(var j=1;j<PH.length;j++){
          pips.children[j-1].classList.toggle("on",j<k);
          pips.children[j-1].classList.toggle("cur",j===k);
        }
      }
      totalEl.textContent=p.t==="prep"?"":"осталось "+mmss(TOTAL-el);
      sync();
      if(w>=1 && w<=3){ tone(660,.09); say(["один","два","три"][w-1]); buzz(60); }
    }
    raf=requestAnimationFrame(tick);
  }

  function start(){
    audioMode(); audioOn(); awake(); fit(); stopHold();
    say("Приготовься");
    PH=phases(); TOTAL=PH[PH.length-1].end; buildPips(PH);
    state="running"; app.className="app running";
    t0=performance.now(); lost=0; pausedAt=0; last=""; cur=-1;
    mainBtn.textContent="Пауза";
    raf=requestAnimationFrame(tick);
  }
  function pause(){
    pausedAt=performance.now(); cancelAnimationFrame(raf); sleep(); hush();
    state="paused"; app.classList.remove("running"); app.classList.add("paused");
    mainBtn.textContent="Дальше"; sync();
  }
  function resume(){
    lost+=performance.now()-pausedAt; pausedAt=0; awake();
    state="running"; app.classList.remove("paused"); app.classList.add("running");
    mainBtn.textContent="Пауза"; sync();
    raf=requestAnimationFrame(tick);
  }
  function finish(){
    cancelAnimationFrame(raf); sleep();
    tone(880,.14); setTimeout(function(){tone(880,.14);},180); setTimeout(function(){tone(1320,.3);},380);
    say("Готово");
    buzz([200,90,200,90,400]);
    state="done"; app.className="app done";
    for(var j=0;j<pips.children.length;j++){ pips.children[j].classList.add("on"); pips.children[j].classList.remove("cur"); }
    fill.style.height="0%";
    clock.textContent="Готово";
    cap.textContent=cfg.n+" "+plural(cfg.n,"раунд","раунда","раундов")+" · "+mmss(TOTAL-PREP);
    roundEl.textContent="EMOM"; totalEl.textContent="";
    mainBtn.textContent="Ещё раз"; sync();
  }
  function reset(){
    cancelAnimationFrame(raf); sleep(); hush();
    state="idle"; app.className="app idle";
    fill.style.height="0%"; clock.textContent=""; cap.textContent="";
    mainBtn.textContent="Старт";
    render();
  }

  mainBtn.addEventListener("click",function(){
    if(state==="idle"||state==="done") start();
    else if(state==="running") pause();
    else if(state==="paused") resume();
  });
  resetBtn.addEventListener("click",reset);

  fit(); render();
})();
</script>
<script>
if("serviceWorker" in navigator){
  var hadSW=!!navigator.serviceWorker.controller;
  addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  /* новая версия приложения подхватывается сразу, но только на экране настройки */
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(hadSW && document.querySelector(".app.idle")) location.reload();
  });
}
</script>
</body>
</html>
